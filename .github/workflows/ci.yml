name: CI

on:
  push:
  pull_request:

# One run per branch/PR at a time; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      # The real config/env.json is git-ignored. Analysis and tests don't
      # need a working Agora App ID, so the committed template is enough.
      - name: Use example config
        run: cp config/env.example.json config/env.json

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --dart-define-from-file=config/env.json
