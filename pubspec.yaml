name: agora_flutter_quickstart
description: DAB Fitness - connects users with fitness trainers.

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  agora_rtc_engine: ^6.6.4
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  http: ^1.6.0
  location: ^10.0.2
  geocoding: ^5.0.0
  google_fonts: ^9.0.0
  video_player: ^2.14.1
  card_swiper: ^3.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/offline_videos/
    - assets/images/workout/